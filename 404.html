<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Dra. Daniela Pestilli</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5efe6;
    --ink: #2b2620;
    --muted: #7a6e60;
    --accent: #c9a875;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 32px;
    text-align: center;
  }
  .wrap { max-width: 520px; }
  .code {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(80px, 18vw, 140px);
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--accent);
    line-height: 1;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: clamp(28px, 5vw, 40px);
    margin: 16px 0 12px;
  }
  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  a {
    display: inline-block;
    padding: 14px 28px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--cream);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    transition: transform .2s ease, background .2s ease;
  }
  a:hover { transform: translateY(-2px); background: var(--accent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>A página que você procurou não existe ou foi movida.<br>Que tal voltar para o início?</p>
    <a href="/">Voltar para o site</a>
  </div>
</body>
</html>
